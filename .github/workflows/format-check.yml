name: Check v5.2 Python formatting

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Black
        run: python -m pip install black==24.10.0
      - name: Check v5.2 release surface
        run: >-
          python -m black --check
          knowledge_storm/paperstorm_real_eval_v52.py
          knowledge_storm/paperstorm_retrieval_v41.py
          knowledge_storm/paperstorm_router_llm.py
          knowledge_storm/paperstorm_service.py
          knowledge_storm/paperstorm_production_v45.py
          tests/test_paperstorm_real_eval_v52.py
          tests/test_paperstorm_release_integrity_v52.py
